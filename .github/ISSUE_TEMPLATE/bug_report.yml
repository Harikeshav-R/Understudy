name: Bug Report
description: Report an issue or unexpected behavior in Understudy
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please ensure you have checked `AGENTS.md` and existing issues before submitting.
  - type: textarea
    id: summary
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps or command line invocations to reproduce the behavior.
      placeholder: |
        1. Run '...'
        2. Execute '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Output / Logs
      description: Output from terminal, logs, or stack trace.
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment & System Details
      description: Relevant environment info (OS, Python version, Docker RAM allocation, uv version).
      value: |
        - OS: macOS / Linux
        - Python version: 3.12.x
        - uv version:
        - Docker allocated RAM:
    validations:
      required: true

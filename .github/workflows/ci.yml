name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Typecheck, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Code format check (ruff format)
        run: uv run ruff format --check .

      - name: Code lint check (ruff check)
        run: uv run ruff check .

      - name: Static type check (mypy --strict)
        run: uv run mypy --strict src tests

      - name: Import architecture boundaries (import-linter)
        run: uv run lint-imports

      - name: Unit tests with 100% line & branch coverage
        run: uv run pytest --cov=understudy --cov-branch --cov-fail-under=100

# Deterministic scoring weights and ceilings (architecture §2.7)
recovery_weight: 0.40
blast_weight: 0.25
downstream_weight: 0.20
violations_weight: 0.15

# Ceilings and thresholds
recovery_timeout_seconds: 180.0
downstream_error_ceiling: 0.10
violation_ceiling: 5
mirror_drop_ceiling: 0.05
min_probe_samples: 60
ambiguity_margin: 0.15

# Canonical traffic request shares per demo service (architecture §2.6)
service_request_shares:
  edge-gateway: 0.40
  auth-service: 0.30
  data-service: 0.20
  worker: 0.10

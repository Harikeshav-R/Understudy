apiVersion: v1
kind: ServiceAccount
metadata:
  name: understudy-prod
  namespace: ust-prod
  labels:
    app.kubernetes.io/part-of: understudy
    environment: production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: understudy-prod
  namespace: ust-prod
  labels:
    app.kubernetes.io/part-of: understudy
    environment: production
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: understudy-prod
  namespace: ust-prod
  labels:
    app.kubernetes.io/part-of: understudy
    environment: production
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: understudy-prod
subjects:
  - kind: ServiceAccount
    name: understudy-prod
    namespace: ust-prod

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: twin-egress-containment
  labels:
    app.kubernetes.io/part-of: understudy
    environment: twin
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # 1. Allow traffic to other pods in the same twin namespace
    - to:
        - podSelector: {}
    # 2. Allow DNS resolution via kube-system
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # 3. Allow egress to ust-system (twin-postgres and egress-stub)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ust-system
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8080

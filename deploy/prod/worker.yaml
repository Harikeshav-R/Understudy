apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ust-prod
  labels:
    app: worker
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: understudy
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: understudy
        understudy.dev/scrape: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: worker
          image: localhost:5001/worker:good
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: UNDERSTUDY_ROLE
              value: "prod"
            - name: DATABASE_URL
              value: "postgresql://postgres@prod-postgres:5432/ust_prod"
            - name: POLL_INTERVAL_SECONDS
              value: "1.0"
            - name: FAULT_INJECTION_SEED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: FAULT_INJECTION_SEED
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 150Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: ust-prod
  labels:
    app: worker
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: understudy
spec:
  type: ClusterIP
  selector:
    app: worker
  ports:
    - name: http
      port: 8000
      targetPort: 8000

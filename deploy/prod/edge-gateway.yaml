apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-gateway
  namespace: ust-prod
  labels:
    app: edge-gateway
    app.kubernetes.io/name: edge-gateway
    app.kubernetes.io/part-of: understudy
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edge-gateway
  template:
    metadata:
      labels:
        app: edge-gateway
        app.kubernetes.io/name: edge-gateway
        app.kubernetes.io/part-of: understudy
        understudy.dev/scrape: 'true'
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8000'
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: edge-gateway
          image: localhost:5001/edge-gateway:good
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: UNDERSTUDY_ROLE
              value: prod
            - name: UNDERSTUDY_FAULT_INJECTION_ENABLED
              value: 'false'
            - name: AUTH_SERVICE_URL
              value: http://auth-service:8000
            - name: DATA_SERVICE_URL
              value: http://data-service:8000
            - name: HTTP_TIMEOUT_SECONDS
              value: '5.0'
            - name: FAULT_INJECTION_SEED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: FAULT_INJECTION_SEED
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 150Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: edge-gateway
  namespace: ust-prod
  labels:
    app: edge-gateway
    app.kubernetes.io/name: edge-gateway
    app.kubernetes.io/part-of: understudy
spec:
  type: ClusterIP
  selector:
    app: edge-gateway
  ports:
    - name: gateway
      port: 8080
      targetPort: 8000

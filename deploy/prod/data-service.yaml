apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-service
  namespace: ust-prod
  labels:
    app: data-service
    app.kubernetes.io/name: data-service
    app.kubernetes.io/part-of: understudy
    app.kubernetes.io/component: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-service
  template:
    metadata:
      labels:
        app: data-service
        app.kubernetes.io/name: data-service
        app.kubernetes.io/part-of: understudy
        understudy.dev/scrape: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: data-service
          image: localhost:5001/data-service:good
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: UNDERSTUDY_ROLE
              value: "prod"
            - name: DATABASE_URL
              value: "postgresql://postgres:postgres@prod-postgres:5432/ust_prod"
            - name: DATA_SERVICE_VARIANT
              value: "good"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 150Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: data-service
  namespace: ust-prod
  labels:
    app: data-service
    app.kubernetes.io/name: data-service
    app.kubernetes.io/part-of: understudy
spec:
  type: LoadBalancer
  selector:
    app: data-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
    - name: admin-fault
      port: 8081
      targetPort: 8000

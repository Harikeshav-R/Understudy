apiVersion: apps/v1
kind: Deployment
metadata:
  name: twin-postgres
  namespace: ust-system
  labels:
    app: twin-postgres
    app.kubernetes.io/name: twin-postgres
    app.kubernetes.io/part-of: understudy
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: twin-postgres
  template:
    metadata:
      labels:
        app: twin-postgres
        app.kubernetes.io/name: twin-postgres
        app.kubernetes.io/part-of: understudy
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          args:
            - "-c"
            - "max_connections=300"
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_HOST_AUTH_METHOD
              value: trust
            - name: POSTGRES_DB
              value: postgres
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 700Mi
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - postgres
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - postgres
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: twin-postgres
  namespace: ust-system
  labels:
    app: twin-postgres
    app.kubernetes.io/name: twin-postgres
    app.kubernetes.io/part-of: understudy
spec:
  type: LoadBalancer
  selector:
    app: twin-postgres
  ports:
    - name: host-port
      port: 5433
      targetPort: 5432

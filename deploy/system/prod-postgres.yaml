apiVersion: apps/v1
kind: Deployment
metadata:
  name: prod-postgres
  namespace: ust-prod
  labels:
    app: prod-postgres
    app.kubernetes.io/name: prod-postgres
    app.kubernetes.io/part-of: understudy
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prod-postgres
  template:
    metadata:
      labels:
        app: prod-postgres
        app.kubernetes.io/name: prod-postgres
        app.kubernetes.io/part-of: understudy
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          args:
            - "-c"
            - "max_connections=200"
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_HOST_AUTH_METHOD
              value: trust
            - name: POSTGRES_DB
              value: ust_prod
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 400Mi
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - ust_prod
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - ust_prod
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: prod-postgres
  namespace: ust-prod
  labels:
    app: prod-postgres
    app.kubernetes.io/name: prod-postgres
    app.kubernetes.io/part-of: understudy
spec:
  type: LoadBalancer
  selector:
    app: prod-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

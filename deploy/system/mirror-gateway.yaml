apiVersion: apps/v1
kind: Deployment
metadata:
  name: mirror-gateway
  namespace: ust-system
  labels:
    app: mirror-gateway
    app.kubernetes.io/name: mirror-gateway
    app.kubernetes.io/part-of: understudy
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mirror-gateway
  template:
    metadata:
      labels:
        app: mirror-gateway
        app.kubernetes.io/name: mirror-gateway
        app.kubernetes.io/part-of: understudy
        understudy.dev/scrape: 'true'
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8000'
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: mirror-gateway
          image: localhost:5001/mirror-gateway:good
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: UNDERSTUDY_ROLE
              value: system
            - name: TARGET_PROD_URL
              value: http://edge-gateway.ust-prod:8080
            - name: MIRROR_QUEUE_MAXSIZE
              value: '1000'
            - name: MIRROR_WORKER_TIMEOUT_SECONDS
              value: '2.0'
            - name: MIRROR_HTTP_TIMEOUT_SECONDS
              value: '5.0'
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 250Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mirror-gateway
  namespace: ust-system
  labels:
    app: mirror-gateway
    app.kubernetes.io/name: mirror-gateway
    app.kubernetes.io/part-of: understudy
    app.kubernetes.io/component: gateway
spec:
  type: LoadBalancer
  selector:
    app: mirror-gateway
  ports:
    - name: gateway
      port: 8080
      targetPort: 8000
